<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1080p Resume Screen</title>
<style>
    body {
        margin: 0;
        background-color: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* 1080p Container (Locked to 16:9 aspect ratio) */
    .video-container {
        width: 100%;
        max-width: 1920px;
        aspect-ratio: 16 / 9;
        /* Dark gradient background to simulate a paused video */
        background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8));
        background-size: cover;
        position: relative;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        overflow: hidden;
    }

    /* Editable Video Title */
    .video-title {
        position: absolute;
        top: 60px;
        left: 80px;
        font-size: 3.5rem;
        font-weight: 600;
        text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        margin: 0;
        letter-spacing: 1px;
    }

    /* Center Content (Resume Button) */
    .center-ui {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .resume-btn {
        background-color: #e50914; 
        color: white;
        border: none;
        padding: 18px 50px;
        font-size: 1.8rem;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
        display: flex;
        align-items: center;
        gap: 15px;
        box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    }

    .resume-btn:hover {
        background-color: #f40612;
        transform: scale(1.05);
    }

    .resume-btn:active {
        transform: scale(0.95);
    }

    /* SVG Play Icon */
    .play-icon {
        width: 30px;
        height: 30px;
        fill: currentColor;
    }
</style>
</head>
<body>

<div class="video-container">
    
    <!-- REPLACE THE NAME OF THE VIDEO HERE -->
    <h1 class="video-title">YOUR VIDEO NAME HERE</h1>

    <!-- ONLY RESUME BUTTON INCLUDED -->
    <div class="center-ui">
        <button class="resume-btn">
            <svg class="play-icon" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>
            Resume
        </button>
    </div>
    
</div>

</body>
</html>
