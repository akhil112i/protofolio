      // ---------------- Scroll Reveal Hook ----------------
      function useScrollReveal() {
        useEffect(() => {
          const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                entry.target.classList.add('active');
              }
            });
          }, { threshold: 0.15 });

          const elements = document.querySelectorAll('.reveal');
          elements.forEach(el => observer.observe(el));

          return () => observer.disconnect();
        }, []);
      }

      // ---------------- Advanced useTypewriter hook ----------------
      function useTypewriter(phrases, typingSpeed = 50, deletingSpeed = 30, pauseTime = 2000) {
        const [text, setText] = useState("");
        const [isDeleting, setIsDeleting] = useState(false);
        const [loopNum, setLoopNum] = useState(0);

        useEffect(() => {
          let timer;
          const currentPhrase = phrases[loopNum % phrases.length];

          if (isDeleting) {
            timer = setTimeout(() => {
              setText(currentPhrase.substring(0, text.length - 1));
            }, deletingSpeed);
          } else {
            timer = setTimeout(() => {
              setText(currentPhrase.substring(0, text.length + 1));
            }, typingSpeed);
          }

          if (!isDeleting && text === currentPhrase) {
            timer = setTimeout(() => setIsDeleting(true), pauseTime);
          } else if (isDeleting && text === "") {
            setIsDeleting(false);
            setLoopNum(loopNum + 1);
          }

          return () => clearTimeout(timer);
        }, [text, isDeleting, loopNum, phrases, typingSpeed, deletingSpeed, pauseTime]);

        return text;
      }

      // ---------------- useVideoScrub hook ----------------
      const SENSITIVITY = 0.8;
      function useVideoScrub(videoRef) {
        const prevX = useRef(0);
        const targetTime = useRef(0);
        const isSeeking = useRef(false);
        const queuedSeek = useRef(false);

        const seekTo = useCallback(() => {
          const video = videoRef.current;
          if (!video) return;
          if (isSeeking.current) {
            queuedSeek.current = true;
            return;
          }
          isSeeking.current = true;
          const time = Math.max(0, Math.min(video.duration || 0, targetTime.current));
          video.currentTime = time;
        }, [videoRef]);

        useEffect(() => {
          const video = videoRef.current;
          if (!video) return;

          const handleSeeked = () => {
            isSeeking.current = false;
            if (queuedSeek.current) {
              queuedSeek.current = false;
              seekTo();
            }
          };

          const handleMouseMove = (e) => {
            if (!video || !video.duration) return;
            // Support both touch and mouse events for mobile scrubbing
            const currentX = e.touches ? e.touches[0].clientX : e.clientX;
            const delta = currentX - prevX.current;
            prevX.current = currentX;
            const timeDelta = (delta / window.innerWidth) * SENSITIVITY * video.duration;
            targetTime.current += timeDelta;
            targetTime.current = Math.max(0, Math.min(video.duration, targetTime.current));
            seekTo();
          };

          const handleTouchStart = (e) => {
             prevX.current = e.touches[0].clientX;
          }

          video.addEventListener("seeked", handleSeeked);
          window.addEventListener("mousemove", handleMouseMove);
          window.addEventListener("touchmove", handleMouseMove);
          window.addEventListener("touchstart", handleTouchStart);

          return () => {
            video.removeEventListener("seeked", handleSeeked);
            window.removeEventListener("mousemove", handleMouseMove);
            window.removeEventListener("touchmove", handleMouseMove);
            window.removeEventListener("touchstart", handleTouchStart);
          };
        }, [videoRef, seekTo]);
      }

        const [dragonText, setDragonText] = useState("");
        const [hasPlayed, setHasPlayed] = useState(false); // Tracks if the video has been revealed before

        // HIDE TO BACKSTAGE ON SCROLL UP
        useEffect(() => {
          if (revealStep === 0) return;

          let lastScrollY = window.scrollY;
          
          const handleScroll = () => {
            const currentScrollY = window.scrollY;
            
            // If the user scrolls up by more than 20 pixels, hide the video
            if (lastScrollY - currentScrollY > 20) {
              setRevealStep(0);
              if (outroVideoRef.current) {
                outroVideoRef.current.pause();
                // We purposefully do NOT reset currentTime here so they can resume it
              }
            }
            lastScrollY = currentScrollY;
          };

          window.addEventListener('scroll', handleScroll, { passive: true });
          return () => window.removeEventListener('scroll', handleScroll);
        }, [revealStep]);

        // Typewriter Effect for the hidden easter egg
        useEffect(() => {
          if (revealStep === 1) {
            const fullText = "I'm Dragon Warrior";
            let i = 0;
            const interval = setInterval(() => {
              setDragonText(fullText.slice(0, i + 1));
              i++;
              if (i === fullText.length) {
                clearInterval(interval);
                // Pause for a moment after typing before showing the video
                setTimeout(() => {
                  setRevealStep(2);
                  setHasPlayed(true); // Mark as played so the button becomes "Resume"
                }, 1200);
              }
            }, 120);
            return () => clearInterval(interval);
          }
        }, [revealStep]);

        // Auto-play video when revealed
        useEffect(() => {
          if (revealStep === 2 && outroVideoRef.current) {
            outroVideoRef.current.play().catch(e => console.error("Video play failed:", e));
          }
        }, [revealStep]);

        // Hide to backstage when the video container is clicked
        const handleVideoClick = () => {
          if (outroVideoRef.current) {
            outroVideoRef.current.pause();
            setRevealStep(0); // Send it to the backstage
          }
        };

        // Handle the trigger button logic (End Credits vs Resume)
        const handleTriggerClick = () => {
          if (hasPlayed) {
            // If they are resuming, skip the typing animation and go straight to the video
            setRevealStep(2);
          } else {
            // First time playing, show the typing animation
            setRevealStep(1);
          }
        };

        return (
          <footer id="contact" className="py-40 px-6 sm:px-12 md:px-20 max-w-7xl mx-auto border-t border-white/10 flex flex-col items-center text-center relative">
            
            <div className="reveal max-w-3xl flex flex-col items-center w-full">
              <h2 className="text-[45px] sm:text-[65px] font-medium tracking-tight mb-6 leading-tight" style={{ fontFamily: "var(--font-heading)" }}>
                Let's build something <br className="hidden sm:block"/> incredible together.
              </h2>
              <p className="text-white/60 text-[20px] mb-12 leading-relaxed">
                I am actively seeking entry-level software engineering roles and cloud computing opportunities. My inbox is always open for collaborations or just to say hi.
              </p>
              
              <div className="flex flex-col items-center gap-8 mb-16">
                <a href="mailto:akhil172003@gmail.com" className="inline-block bg-white text-[#0a0a0a] font-medium px-10 py-5 rounded-full text-[18px] hover:scale-105 hover:shadow-[0_0_40px_rgba(255,255,255,0.4)] transition-all duration-300">
                  Get in Touch →
                </a>
              </div>
            </div>
            
            <div className="w-full pt-24 mt-12 border-t border-white/10 flex flex-col sm:flex-row justify-between items-center text-white/40 text-[15px] gap-4" style={{ fontFamily: "var(--font-mono)" }}>
              <span>© {new Date().getFullYear()} Akhil Ajay. All rights reserved.</span>
              <span>Designed & Built with React & Tailwind</span>
            </div>

            {/* The trigger button (Changes to Resume after first play) */}
            {revealStep === 0 && (
              <button 
                onClick={handleTriggerClick}
                className="mt-8 text-[11px] text-[#111111] hover:text-[#00d8ff] transition-colors duration-700 cursor-pointer uppercase tracking-widest outline-none"
                style={{ fontFamily: "var(--font-mono)" }}
              >
                {hasPlayed ? "Resume" : "End Credits"}
              </button>
            )}

            {/* Secret Easter Egg Area */}
            {revealStep > 0 && (
              <div className="w-full max-w-2xl flex flex-col items-center justify-center gap-8 mt-16 min-h-[100px]">
                
                {/* Typing Stage */}
                {revealStep === 1 && (
                  <div className="text-[#00d8ff] text-[24px] sm:text-[32px] font-medium tracking-widest uppercase drop-shadow-[0_0_15px_rgba(0,216,255,0.6)]" style={{ fontFamily: "var(--font-mono)" }}>
                    {dragonText}<span className="blink-cursor inline-block w-[12px] h-[1em] bg-[#00d8ff] align-middle ml-2"></span>
                  </div>
                )}
                
                {/* Video Reveal Stage */}
                {revealStep === 2 && (
                  <div 
                    className="w-full rounded-2xl overflow-hidden border border-white/10 shadow-[0_0_30px_rgba(0,216,255,0.1)] cursor-pointer animate-[fadeIn_1s_ease-out_forwards]"
                    onClick={handleVideoClick}
                    title="Click to hide video"
                  >
                    <video 
                      ref={outroVideoRef}
                      src="vidssave.com It's Blank Meme Template HD 1080P.mp4" 
                      loop
                      playsInline
                      className="w-full h-auto"
                    />
                  </div>
                )}
              </div>
            )}
          </footer>
        );
      };

      // ---------------- Main App Component ----------------
      const App = () => {
        useScrollReveal();
        return (
          <>
            <Navbar />
            <main>
              <Hero />
              <About />
              <Projects />
              <Skills />
              <Experience />
              <Education />
            </main>
            <Contact />
          </>
        );
      };

      const root = createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
